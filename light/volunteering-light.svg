  <text x="1166" y="23" text-anchor="end" class="tag">VOLUNTEER.LOG</text>
</g>

<text x="34" y="66.0"><tspan fill="#059669" font-weight="bold">- VOLUNTEERING &amp; COMMUNITY</tspan><tspan fill="#94A3B8"> -————————————————————————————————————————————————————————————————————-</tspan></text>
<text x="34" y="104.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">Public Relations Executive Board Member</tspan></text>
<text x="34" y="129.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Org</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">LSAC Bucuresti</tspan></text>
<text x="34" y="154.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Period</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">Aug 2026 - present</tspan></text>
<text x="34" y="193.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">Serving as a core member of the PR Executive Board required strategic decision-making, high-level cross-</tspan></text>
<text x="34" y="218.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">departmental alignment, and active operational leadership across all organizational initiatives. Acting as</tspan></text>
<text x="34" y="243.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">the right-hand support to the PR Department Coordinator, I helped shape the department&#x27;s overall strategy,</tspan></text>
<text x="34" y="268.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">streamline communication workflows, and drive key operational decisions throughout the year.</tspan></text>
<text x="34" y="307.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">In this role, I provided end-to-end strategic guidance and hands-on support for PR managers across various</tspan></text>
<text x="34" y="332.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">events and project teams. My responsibilities included assisting in content strategy review, problem-solving</tspan></text>
<text x="34" y="357.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">under tight deadlines, and ensuring consistent brand alignment for every campaign. Beyond high-level</tspan></text>
<text x="34" y="382.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">planning, I actively mentored team leaders, facilitated cross-functional collaboration with logistics,</tspan></text>
<text x="34" y="407.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">technical, and HR divisions, and provided real-time crisis management during live events to maintain smooth</tspan></text>
<text x="34" y="432.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">execution and high audience engagement.</tspan></text>
<text x="34" y="471.0"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">External Relations PR Manager</tspan></text>
<text x="34" y="496.0"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Org</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">LSAC Bucuresti</tspan></text>
<text x="34" y="521.0"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Period</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">Aug 2026 - present</tspan></text>
<text x="34" y="559.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">Coordinating external relations and promotional efforts throughout the year required a strategic mix of</tspan></text>
<text x="34" y="584.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">consistent brand messaging, real-time event coverage, and dedicated team leadership. In this role, I shape</tspan></text>
<text x="34" y="609.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">how our external activities, corporate collaborations, and university initiatives connected with our</tspan></text>
<text x="34" y="634.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">audience.</tspan></text>
<text x="34" y="673.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">Throughout the year, I manage the full PR workflow for all External Relations initiatives. My</tspan></text>
<text x="34" y="698.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">responsibilities include writing, editing, and publishing informative and promotional copy, as well as</tspan></text>
<text x="34" y="723.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">overseeing visual materials. I lead and mentore a dedicated PR team, delegating tasks effectively to</tspan></text>
<text x="34" y="748.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">maintain a structured publishing schedule across all channels. Additionally, during company-led workshops</tspan></text>
<text x="34" y="773.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">held within the faculty, I ensure active media coverage through real-time Instagram/LinkedIn stories,</tspan></text>
<text x="34" y="798.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">capturing key moments and highlights to drive engagement with students and corporate partners alike.</tspan></text>
<text x="34" y="837.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">Marketing &amp; Public Relations Manager</tspan></text>
<text x="34" y="862.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Org</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">LSAC Bucuresti</tspan></text>
<text x="34" y="887.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Period</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">Jul 2025 - Jul 2026</tspan></text>
<text x="34" y="926.0"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">PR Manager for Perpetuum, an engineering hackathon built around Rube-Goldberg-style chain reactions using</tspan></text>
<text x="34" y="951.0"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">Arduino systems. Owned the full PR workflow end to end: promotional strategy, visual and written materials,</tspan></text>
<text x="34" y="976.0"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">and a volunteer team assigned by strength.</tspan></text>
<text x="34" y="1014.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">Worked under tight deadlines alongside the logistics, technical, Multimedia, Design, FundRaising, and HR</tspan></text>
<text x="34" y="1039.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">departments, translating a complex technical competition into a narrative students could easily connect with</tspan></text>
<text x="34" y="1064.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">- strengthening organizational leadership, clear communication under pressure, and confident ownership of</tspan></text>
<text x="34" y="1089.8"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">responsibility.</tspan></text>
<text x="34" y="1128.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">Public Relations Department Volunteer</tspan></text>
<text x="34" y="1153.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Org</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">LSAC Bucuresti</tspan></text>
<text x="34" y="1178.5"><tspan fill="#94A3B8">. </tspan><tspan fill="#0284C7" font-weight="bold">Period</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1E293B">Oct 2024 - present</tspan></text>
<text x="34" y="1217.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">Promotes the association across social platforms and offline initiatives; volunteered at hackathons such as</tspan></text>
<text x="34" y="1242.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">Perpetuum and HackItAll, the IT&amp;C job fair, and student events - building public speaking, coordination, and</tspan></text>
<text x="34" y="1267.2"><tspan fill="#94A3B8">. </tspan><tspan fill="#1E293B">multi-stakeholder collaboration skills.</tspan></text>

